# =============================================================
# Orquestador - Stack de orquestacion y canales
# =============================================================
# Maneja la comunicacion con canales externos (WhatsApp, Telegram,
# Web, etc.) y coordina las llamadas a los servicios de IA.
#
# Servicios:
#   - redis: Cola de mensajes + historial de conversaciones
#   - nginx: Load balancer para workers
#   - workers: Procesa mensajes y coordina servicios IA (escalable)
#   - autoscaler: Escala workers automaticamente segun demanda
#
# Arquitectura Alta Disponibilidad:
#   Canal -> Nginx -> Workers (1-N) -> Redis -> IA Services
#
# Uso:
#   docker compose build
#   docker compose up -d
# =============================================================

services:
  # -----------------------------------------------------------
  # Redis - Cola de mensajes + Historial
  # -----------------------------------------------------------
  # Base de datos en memoria para:
  # - Cola de mensajes (alta disponibilidad)
  # - Historial de conversaciones por usuario
  # - Cache de sesiones
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    container_name: redis-orquestador
    hostname: redis-orquestador
    environment:
      - TZ=${TZ}
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-orquestador123}
    volumes:
      - ./stack_data/redis:/data
    networks:
      - agente_ia
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-orquestador123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # -----------------------------------------------------------
  # Nginx - Load Balancer
  # -----------------------------------------------------------
  # Distribuye la carga entre multiples workers
  # Expone el puerto 8000 para webhooks y API
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    container_name: orquestador
    hostname: orquestador
    environment:
      - TZ=${TZ}
    volumes:
      - ./dockerfiles/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8000:80"
    networks:
      - agente_ia
    depends_on:
      - workers
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # -----------------------------------------------------------
  # Workers - Procesadores de mensajes (escalable)
  # -----------------------------------------------------------
  # API que:
  # - Recibe webhooks de canales (WhatsApp, Telegram, etc.)
  # - Encola mensajes en Redis
  # - Procesa mensajes y llama a servicios de IA
  # - Envia respuestas a los canales
  #
  # Endpoints:
  #   - /health: Estado del servicio
  #   - /webhook/evolution: Webhook WhatsApp (Evolution API)
  #   - /webhook/telegram: Webhook Telegram (futuro)
  #   - /api/chat: API directa de chat
  #   - /api/voice: API directa de voz
  #
  # Nota: Sin container_name para permitir replicas
  workers:
    build:
      context: ./dockerfiles
      dockerfile: Dockerfile.workers
    image: orquestador-workers
    restart: unless-stopped
    # Sin container_name para permitir multiples replicas
    environment:
      - TZ=${TZ}
      # URLs de servicios de IA (stack agente_ia)
      - STT_URL=${STT_URL:-http://agente_ia:8001}
      - TTS_URL=${TTS_URL:-http://agente_ia:8002}
      - LLM_URL=${LLM_URL:-http://agente_ia:11434}
      # Modelos de Ollama
      - LLM_CHAT_MODEL=${LLM_CHAT_MODEL:-qwen2.5:7b}
      - LLM_IMG_MODEL=${LLM_IMG_MODEL:-llava:7b}
      - LLM_DOCS_MODEL=${LLM_DOCS_MODEL:-llava:7b}
      # Evolution API (Messaging Stack)
      - EVOLUTION_URL=${EVOLUTION_URL:-http://evolution:8080}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY:-}
      # Nombre del asistente
      - NOMBRE_IA=${NOMBRE_IA:-Asistente}
      # Redis local
      - REDIS_URL=redis://:${REDIS_PASSWORD:-orquestador123}@redis-orquestador:6379/0
    volumes:
      - ./stack_data/workers/app:/app
    networks:
      - agente_ia
    depends_on:
      redis:
        condition: service_healthy
    # Sin puerto expuesto, nginx enruta el trafico

  # -----------------------------------------------------------
  # Autoscaler - Escalado automatico
  # -----------------------------------------------------------
  # Monitorea la cola de Redis y escala workers:
  # - Cola > 20 mensajes: agregar worker
  # - Cola < 10 mensajes: reducir workers (minimo 1)
  autoscaler:
    build:
      context: ./dockerfiles
      dockerfile: Dockerfile.autoscaler
    image: orquestador-autoscaler
    restart: unless-stopped
    container_name: autoscaler
    hostname: autoscaler
    environment:
      - TZ=${TZ}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-orquestador123}@redis-orquestador:6379/0
      - QUEUE_KEY=${QUEUE_KEY:-mensajes:pendientes}
      - CHECK_INTERVAL=${AUTOSCALE_CHECK_INTERVAL:-30}
      - SCALE_UP_THRESHOLD=${AUTOSCALE_UP_THRESHOLD:-20}
      - SCALE_DOWN_THRESHOLD=${AUTOSCALE_DOWN_THRESHOLD:-10}
      - MIN_WORKERS=${AUTOSCALE_MIN_WORKERS:-1}
      - MAX_WORKERS=${AUTOSCALE_MAX_WORKERS:-5}
      - SCALE_COOLDOWN=${AUTOSCALE_COOLDOWN:-60}
      - COMPOSE_PROJECT=orquestador
      - WORKER_SERVICE=workers
    volumes:
      # Acceso al socket de Docker para escalar
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Acceso al directorio del proyecto para docker compose
      - ./:/opt/stacks/orquestador:ro
    networks:
      - agente_ia
    depends_on:
      redis:
        condition: service_healthy

# Red externa compartida con otros stacks
networks:
  agente_ia:
    external: true
