# =============================================================
# Nginx Load Balancer - Orquestador
# =============================================================
# Distribuye la carga entre multiples workers
# Docker DNS resuelve "workers" a todas las replicas
# =============================================================

events {
    worker_connections 1024;
}

http {
    # Configuracion de upstream
    # Docker DNS resuelve automaticamente a todas las replicas
    upstream workers_backend {
        # Usar DNS de Docker para resolver todas las replicas
        # El resolver de Docker actualiza automaticamente cuando hay cambios
        server workers:8000 max_fails=3 fail_timeout=30s;

        # Mantener conexiones persistentes
        keepalive 32;
    }

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" upstream=$upstream_addr';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    server {
        listen 80;
        server_name _;

        # Permitir payloads grandes (documentos, imagenes)
        client_max_body_size 50M;

        # Timeouts largos para llamadas a servicios de IA
        proxy_connect_timeout 300s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Buffering para respuestas grandes
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;

        # Health check del load balancer
        location /nginx-health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # Health check de workers (forward)
        location /health {
            proxy_pass http://workers_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Webhooks
        location /webhook/ {
            proxy_pass http://workers_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # API
        location /api/ {
            proxy_pass http://workers_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # Catch-all
        location / {
            proxy_pass http://workers_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }
    }
}
